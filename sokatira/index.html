<!DOCTYPE html>
<html lang="eu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talde-lehiaketa · Competición por equipos · Team Challenge</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1b1d33;
    --paper: #ffffff;
    --bg: #eef1f6;
    --a: #5b3cc4; --a-soft: #ece7fb;
    --b: #0b9a6d; --b-soft: #e2f5ed;
    --ok: #16a34a; --bad: #dc2626;
    --rope: #a8743f;
    --muted: #6b7280;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Lexend', system-ui, sans-serif;
    background: var(--bg); color: var(--ink);
    display: flex; flex-direction: column; overflow: hidden;
    user-select: none; -webkit-user-select: none; touch-action: manipulation;
  }
  button { font-family: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 4px solid #ffc20e; outline-offset: 3px; }
  .hidden { display: none !important; }

  /* ── Top bar ── */
  .top { height: 64px; flex: none; background: var(--ink); color: #fff; display: flex; align-items: center; gap: 18px; padding: 0 20px; }
  .top h1 { font-size: 1.45rem; font-weight: 800; }
  .top .topic { font-weight: 600; color: #b9bdf0; }
  .top .spacer { flex: 1; }
  .clock { font-size: 1.6rem; font-weight: 800; font-variant-numeric: tabular-nums; min-width: 90px; text-align: right; }
  .clock.low { color: #ff7a7a; }
  .home { border: 2px solid #fff; background: transparent; color: #fff; border-radius: 999px; padding: 7px 16px; font-weight: 600; font-size: 0.95rem; }

  /* ── Rope ── */
  .rope { flex: none; height: 24vh; min-height: 150px; background: var(--paper); border-bottom: 4px solid var(--ink); }
  .rope svg { width: 100%; height: 100%; display: block; }
  #pull { transition: transform 0.45s cubic-bezier(.34,1.4,.64,1); }

  /* ── Arena ── */
  .arena { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; }
  .side { display: flex; flex-direction: column; padding: 2.2vh 2vw; gap: 1.8vh; min-height: 0; }
  .side.A { background: var(--a-soft); --c: var(--a); border-right: 4px solid var(--ink); }
  .side.B { background: var(--b-soft); --c: var(--b); }
  .s-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .s-name { font-size: clamp(1.2rem, 2vw, 2rem); font-weight: 800; color: var(--c); }
  .s-score { font-size: clamp(1rem, 1.4vw, 1.4rem); font-weight: 600; background: var(--c); color: #fff; padding: 6px 16px; border-radius: 999px; white-space: nowrap; }
  .q { background: var(--paper); border-radius: 18px; padding: 2.2vh 1.6vw; font-size: clamp(1.15rem, 2vw, 2.1rem); font-weight: 600; line-height: 1.25; min-height: 18vh; display: flex; align-items: center; border-left: 10px solid var(--c); }
  .answers { flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 1fr; gap: 1.4vh 1vw; min-height: 0; }
  .ans {
    border: 3px solid transparent; background: var(--paper); color: var(--ink);
    border-radius: 16px; padding: 1.2vh 1vw;
    font-size: clamp(0.95rem, 1.45vw, 1.55rem); font-weight: 600; line-height: 1.2;
    display: flex; align-items: center; gap: 0.8vw; text-align: left;
    box-shadow: 0 4px 0 rgba(27,29,51,0.12);
    transition: transform 0.08s;
  }
  .ans:active { transform: translateY(2px); }
  .ans .k { flex: none; width: 2.4em; height: 2.4em; border-radius: 10px; background: var(--c); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 0.85em; }
  .ans.ok { background: var(--ok); color: #fff; border-color: var(--ok); }
  .ans.bad { background: var(--bad); color: #fff; border-color: var(--bad); }
  .ans.ok .k, .ans.bad .k { background: rgba(255,255,255,0.25); }
  .ans.dim { opacity: 0.45; }

  /* ── Overlays ── */
  .overlay { position: fixed; inset: 0; background: rgba(27,29,51,0.85); display: grid; place-items: center; padding: 20px; z-index: 10; }
  .panel { background: var(--paper); border-radius: 26px; padding: 36px 42px; width: min(760px, 100%); max-height: calc(100vh - 40px); overflow: auto; }
  .panel h2 { font-size: clamp(2rem, 4.5vw, 3.2rem); font-weight: 800; line-height: 1; letter-spacing: -0.02em; }
  .panel .topic2 { font-size: 1.3rem; font-weight: 600; color: var(--a); margin-top: 6px; }
  .panel .lead { font-size: 1.15rem; line-height: 1.5; margin: 18px 0 6px; }
  .panel .note { color: var(--muted); line-height: 1.5; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 22px; align-items: flex-end; }
  .field { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 180px; }
  .field label { font-size: 0.9rem; font-weight: 600; color: var(--muted); }
  .field input, .field select { font: 600 1.15rem Lexend, sans-serif; padding: 12px 14px; border-radius: 12px; border: 3px solid #d7dbe6; background: #fff; color: var(--ink); }
  .langs { display: inline-flex; background: var(--ink); border-radius: 999px; padding: 5px; gap: 4px; }
  .langs button { border: none; background: transparent; color: #fff; font-weight: 800; font-size: 1rem; padding: 9px 18px; border-radius: 999px; }
  .langs button.on { background: #ffc20e; color: var(--ink); }
  .go { margin-top: 26px; background: var(--ink); color: #fff; border: none; border-radius: 999px; font-weight: 800; font-size: 1.35rem; padding: 16px 44px; }
  .go.light { background: #e3e6ef; color: var(--ink); margin-left: 10px; }
  .winner { font-size: clamp(2.2rem, 5vw, 3.6rem); }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 22px; }
  .stat { border-radius: 16px; padding: 16px 18px; }
  .stat.A { background: var(--a-soft); border-left: 8px solid var(--a); }
  .stat.B { background: var(--b-soft); border-left: 8px solid var(--b); }
  .stat b { display: block; font-size: 1.2rem; margin-bottom: 4px; }
  .stat span { font-size: 1.35rem; font-weight: 800; }

  @media (max-width: 800px) {
    body { overflow: auto; }
    .arena { grid-template-columns: 1fr; }
    .side.A { border-right: none; border-bottom: 4px solid var(--ink); }
    .answers { grid-template-columns: 1fr; }
    .top h1 { font-size: 1.1rem; } .top .topic { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { #pull { transition: none; } }
</style>
</head>
<body>

<header class="top">
  <h1 data-t="title"></h1>
  <span class="topic" data-t="topic"></span>
  <span class="spacer"></span>
  <div class="clock" id="clock">3:00</div>
  <button class="home" id="home" data-t="home"></button>
</header>

<section class="rope">
  <svg viewBox="0 0 1600 220" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
    <rect x="0" y="182" width="1600" height="38" fill="#e8ebf2"/>
    <line x1="800" y1="20" x2="800" y2="200" stroke="#9aa1b5" stroke-width="4" stroke-dasharray="10 10"/>
    <g id="marks"></g>
    <g id="pull"></g>
  </svg>
</section>

<main class="arena">
  <section class="side A">
    <div class="s-head"><div class="s-name" id="nameA-t"></div><div class="s-score" id="scoreA"></div></div>
    <div class="q" id="qA"></div>
    <div class="answers" id="ansA"></div>
  </section>
  <section class="side B">
    <div class="s-head"><div class="s-name" id="nameB-t"></div><div class="s-score" id="scoreB"></div></div>
    <div class="q" id="qB"></div>
    <div class="answers" id="ansB"></div>
  </section>
</main>

<!-- Setup -->
<div class="overlay" id="setup">
  <div class="panel">
    <div class="langs" role="group" aria-label="Hizkuntza / Idioma / Language">
      <button data-lang="eu">EU</button><button data-lang="es">ES</button><button data-lang="en">EN</button>
    </div>
    <h2 style="margin-top:22px" data-t="title"></h2>
    <div class="topic2" data-t="topic"></div>
    <p class="lead" data-t="lead"></p>
    <p class="note" data-t="note"></p>
    <div class="row">
      <div class="field" style="flex:0 0 140px;min-width:140px"><label for="dur" data-t="time"></label>
        <select id="dur"><option value="120">2 min</option><option value="180" selected>3 min</option><option value="300">5 min</option></select></div>
    </div>
    <div id="names"></div>
    <a class="go light hubLink" href="../index.html" style="text-decoration:none;display:inline-block"></a>
  </div>
</div>

<!-- End -->
<div class="overlay hidden" id="end">
  <div class="panel">
    <h2 class="winner" id="winner"></h2>
    <div class="stats">
      <div class="stat A"><b id="stA"></b><span id="stAn"></span></div>
      <div class="stat B"><b id="stB"></b><span id="stBn"></span></div>
    </div>
    <button class="go" id="again" data-t="again"></button>
    <button class="go light" id="toSetup" data-t="home"></button>
    <a class="go light hubLink" href="../index.html" style="text-decoration:none;display:inline-block"></a>
    <p class="saved" id="saved" style="color:#16a34a;font-weight:600;margin-top:14px"></p>
  </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/common.js"></script>
<script src="questions.js"></script>
<script>
// ============================================================
//  Texts
// ============================================================
const UI = {
  eu: { title: 'Talde-lehiaketa', topic: 'Adimen artifiziala', home: 'Hasiera',
        lead: 'Bi talde aurrez aurre. Erantzun zuzen bakoitzak soka zuen aldera tiratzen du. Soka zuen marraraino eramaten duen taldeak irabazten du!',
        note: 'Talde bakoitzak bere erdian erantzuten du, aldi berean. Erantzun okerra emanez gero, erantzun zuzena erakusten da eta segundo batzuk itxaron behar da.',
        nameLabelA: 'Ezkerreko taldea', nameLabelB: 'Eskuineko taldea', time: 'Denbora', start: 'Hasi',
        A: 'A taldea', B: 'B taldea', score: (c, n) => `✔ ${c} / ${n}`,
        wins: t => `${t} irabazle! 🏆`, tie: 'Berdinketa! 🤝', correct: 'erantzun zuzen', again: 'Berriro jokatu' },
  es: { title: 'Competición por equipos', topic: 'Inteligencia artificial', home: 'Inicio',
        lead: 'Dos equipos cara a cara. Cada respuesta correcta tira de la cuerda hacia vuestro lado. ¡Gana el equipo que lleve la cuerda hasta su línea!',
        note: 'Cada equipo responde en su mitad, a la vez. Si fallas, se muestra la respuesta correcta y hay que esperar unos segundos.',
        nameLabelA: 'Equipo de la izquierda', nameLabelB: 'Equipo de la derecha', time: 'Tiempo', start: 'Empezar',
        A: 'Equipo A', B: 'Equipo B', score: (c, n) => `✔ ${c} / ${n}`,
        wins: t => `¡Gana ${t}! 🏆`, tie: '¡Empate! 🤝', correct: 'respuestas correctas', again: 'Jugar otra vez' },
  en: { title: 'Team Challenge', topic: 'Artificial intelligence', home: 'Home',
        lead: 'Two teams face to face. Every right answer pulls the rope towards your side. The team that drags the rope to its line wins!',
        note: 'Each team answers on its own half, at the same time. After a wrong answer, the right one is shown and you have to wait a few seconds.',
        nameLabelA: 'Left team', nameLabelB: 'Right team', time: 'Time', start: 'Start',
        A: 'Team A', B: 'Team B', score: (c, n) => `✔ ${c} / ${n}`,
        wins: t => `${t} wins! 🏆`, tie: 'It’s a draw! 🤝', correct: 'correct answers', again: 'Play again' }
};
let lang = UI[DB.lang] ? DB.lang : 'eu';
const T = k => UI[lang][k];

function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach(n => n.textContent = T(n.dataset.t));
  document.querySelectorAll('.langs button').forEach(b => b.classList.toggle('on', b.dataset.lang === lang));
  renderNames();
  document.querySelectorAll('.hubLink').forEach(n => n.textContent = DB.t(DB.S.toHub));
}
document.querySelectorAll('.langs button').forEach(b => b.onclick = () => {
  lang = b.dataset.lang;
  DB.lang = lang;
  applyLang();
});

// ============================================================
//  Rope drawing
// ============================================================
const WIN = 6, STEP = 95, CX = 800;
function fig(x, color, dir) { // dir: -1 leans left (team A), 1 leans right (team B)
  const lean = 22 * dir;
  return `<g>
    <line x1="${x}" y1="180" x2="${x + lean * 0.4}" y2="150" stroke="${color}" stroke-width="12" stroke-linecap="round"/>
    <line x1="${x + 14}" y1="180" x2="${x + lean * 0.4 + 6}" y2="150" stroke="${color}" stroke-width="12" stroke-linecap="round"/>
    <line x1="${x + lean * 0.4 + 3}" y1="150" x2="${x + lean}" y2="96" stroke="${color}" stroke-width="22" stroke-linecap="round"/>
    <circle cx="${x + lean * 1.2}" cy="74" r="17" fill="#e0ac85"/>
    <line x1="${x + lean * 0.9}" y1="108" x2="${x - lean * 1.3}" y2="120" stroke="#e0ac85" stroke-width="9" stroke-linecap="round"/>
  </g>`;
}
function drawRope() {
  const m = document.getElementById('marks');
  m.innerHTML = `
    <line x1="${CX - WIN * STEP}" y1="30" x2="${CX - WIN * STEP}" y2="200" stroke="var(--a)" stroke-width="8"/>
    <line x1="${CX + WIN * STEP}" y1="30" x2="${CX + WIN * STEP}" y2="200" stroke="var(--b)" stroke-width="8"/>
    ${Array.from({ length: WIN * 2 - 1 }, (_, i) => { const x = CX + (i - WIN + 1) * STEP; return x === CX ? '' : `<line x1="${x}" y1="186" x2="${x}" y2="200" stroke="#9aa1b5" stroke-width="4"/>`; }).join('')}`;
  const p = document.getElementById('pull');
  p.innerHTML = `
    <line x1="-1000" y1="118" x2="2600" y2="118" stroke="var(--rope)" stroke-width="12" stroke-linecap="round"/>
    <line x1="-1000" y1="118" x2="2600" y2="118" stroke="#7d5229" stroke-width="12" stroke-dasharray="6 14" opacity="0.6"/>
    ${fig(40, 'var(--a)', -1)}${fig(110, 'var(--a)', -1)}${fig(180, 'var(--a)', -1)}
    ${fig(1406, 'var(--b)', 1)}${fig(1476, 'var(--b)', 1)}${fig(1546, 'var(--b)', 1)}
    <path d="M${CX} 118 l-26 60 h52 z" fill="#ffc20e" stroke="var(--ink)" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="${CX}" cy="118" r="14" fill="var(--ink)"/>`;
}

// ============================================================
//  Game
// ============================================================
const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const teams = { A: {}, B: {} };
let pos = 0, timeLeft = 180, total = 180, timer = null, playing = false;

function resetTeam(id) {
  Object.assign(teams[id], { order: shuffle(QUESTIONS.map((_, i) => i)), idx: 0, correct: 0, answered: 0, locked: false });
}
// ── The two teams: names typed before every match ──
const names = { A: '', B: '' }, groups = { A: '', B: '' };
function applyColors() {
  const r = document.documentElement.style;
  r.setProperty('--a', DB.COLORS.L); r.setProperty('--a-soft', '#ece7fb');
  r.setProperty('--b', DB.COLORS.R); r.setProperty('--b-soft', '#ddf4ec');
}
function renderNames() {
  const box = document.getElementById('names');
  const typed = [...box.querySelectorAll('.db-field > input:not(.db-grp)')].map(i => i.value);
  DB.nameForm(box, { count: 2, prefill: typed.length ? typed : [names.A, names.B] }, (n, g) => {
    names.A = n[0]; names.B = n[1]; groups.A = g[0]; groups.B = g[1];
    start();
  });
}
function teamName(id) { return names[id] || T(id); }

function renderScore(id) {
  const t = teams[id];
  document.getElementById('score' + id).textContent = T('score')(t.correct, t.answered);
}

function nextQ(id) {
  const t = teams[id];
  if (t.idx >= t.order.length) { t.order = shuffle(t.order); t.idx = 0; }
  const q = QUESTIONS[t.order[t.idx++]];
  document.getElementById('q' + id).textContent = q.q[lang];
  const box = document.getElementById('ans' + id);
  box.innerHTML = '';
  shuffle([0, 1, 2, 3]).forEach((ai, k) => {
    const b = document.createElement('button');
    b.className = 'ans';
    b.dataset.ok = ai === 0 ? '1' : '0';
    b.innerHTML = `<span class="k">${'ABCD'[k]}</span><span></span>`;
    b.lastChild.textContent = q.a[ai][lang];
    b.addEventListener('pointerdown', e => { e.preventDefault(); answer(id, b); });
    b.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); answer(id, b); } });
    box.appendChild(b);
  });
  t.locked = false;
}

function answer(id, btn) {
  const t = teams[id];
  if (!playing || t.locked) return;
  t.locked = true;
  t.answered++;
  const box = document.getElementById('ans' + id);
  const right = btn.dataset.ok === '1';
  box.querySelectorAll('.ans').forEach(b => { if (b !== btn && b.dataset.ok !== '1') b.classList.add('dim'); });
  if (right) {
    btn.classList.add('ok');
    t.correct++;
    pos += id === 'A' ? -1 : 1;
    movePull();
  } else {
    btn.classList.add('bad');
    box.querySelector('[data-ok="1"]').classList.add('ok');
  }
  renderScore(id);
  if (Math.abs(pos) >= WIN) { setTimeout(() => finish(), 600); return; }
  setTimeout(() => { if (playing) nextQ(id); }, right ? 750 : 2200);
}

function movePull() {
  document.getElementById('pull').style.transform = `translateX(${pos * STEP}px)`;
}

function updateClock() {
  const m = Math.floor(timeLeft / 60), s = timeLeft % 60;
  const c = document.getElementById('clock');
  c.textContent = m + ':' + String(s).padStart(2, '0');
  c.classList.toggle('low', timeLeft <= 15);
}

function start() {
  total = timeLeft = parseInt(document.getElementById('dur').value, 10);
  pos = 0; movePull();
  ['A', 'B'].forEach(id => {
    resetTeam(id);
    document.getElementById('name' + id + '-t').textContent = teamName(id);
    renderScore(id); nextQ(id);
  });
  playing = true;
  updateClock();
  document.getElementById('setup').classList.add('hidden');
  document.getElementById('end').classList.add('hidden');
  clearInterval(timer);
  timer = setInterval(() => { timeLeft--; updateClock(); if (timeLeft <= 0) finish(); }, 1000);
}

function finish() {
  if (!playing) return;
  playing = false;
  clearInterval(timer);
  const w = pos < 0 ? 'A' : pos > 0 ? 'B' : null;
  const h = document.getElementById('winner');
  h.textContent = w ? T('wins')(teamName(w)) : T('tie');
  h.style.color = w ? `var(--${w.toLowerCase()})` : 'var(--ink)';
  ['A', 'B'].forEach(id => {
    document.getElementById('st' + id).textContent = teamName(id);
  });
  const used = total - Math.max(0, timeLeft);
  let where = 'local';
  ['A', 'B'].forEach(id => {
    const tm = teams[id];
    const res = !w ? 'tie' : w === id ? 'win' : 'lose';
    const rec = { game: 'sokatira', teamName: names[id], group: groups[id], rival: names[id === 'A' ? 'B' : 'A'], time: used, total: used,
      correct: tm.correct, wrong: tm.answered - tm.correct, penalty: 0, result: res };
    where = DB.saveResult(rec);
    document.getElementById('st' + id + 'n').textContent = `✔ ${tm.correct} / ${tm.answered} · +${rec.points} ${DB.t(DB.S.pts)}`;
  });
  document.getElementById('saved').textContent = DB.t(where === 'sheet' ? DB.S.saved : DB.S.savedLocal);
  setTimeout(() => document.getElementById('end').classList.remove('hidden'), 500);
}

function toSetup() {
  playing = false; clearInterval(timer);
  document.getElementById('end').classList.add('hidden');
  document.getElementById('setup').classList.remove('hidden');
  renderNames();
}

document.getElementById('again').onclick = start;
document.getElementById('toSetup').onclick = toSetup;
document.getElementById('home').onclick = toSetup;

applyColors();
drawRope();
applyLang();
updateClock();
</script>
</body>
</html>
